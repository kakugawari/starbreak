<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STARBREAK</title>
<meta name="description" content="小さな宇宙船で、巨大な敵に挑む。3D 宇宙シューティング">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <!-- 操作 (遊んでいる間だけ出す) -->
  <div id="controls" hidden>
    <div id="stickZone" aria-label="スティック">
      <div class="stick" id="stick"><div class="stick-knob" id="stickKnob"></div></div>
    </div>
    <button type="button" class="pad" id="btnMissile" aria-label="ミサイル"><span class="pad-ico">◆</span><span class="pad-name">MSL</span><span class="pad-sub" id="missileCount">4</span></button>
    <button type="button" class="pad" id="btnTarget" aria-label="ロックオン (タップで敵を選ぶ・押しっぱなしでその敵へ向く)"><span class="pad-ico">◎</span><span class="pad-name">LOCK</span></button>
    <button type="button" class="pad" id="btnBoost" aria-label="ブースト"><span class="pad-ico">»</span><span class="pad-name">BOOST</span></button>
    <button type="button" class="pad" id="btnFire" aria-label="レーザー"><span class="pad-ico">✦</span><span class="pad-name">LASER</span></button>
    <button type="button" id="btnPause" aria-label="一時停止">II</button>
  </div>

  <!-- ボス戦のカットイン。操作のボタンより上に出す (送ってもらった絵)。指の操作は下へ素通しする -->
  <div id="cutin" aria-hidden="true" hidden><img data-asset="cutin.png" alt="" width="1774" height="410"></div>

  <!-- タイトル -->
  <section id="title" class="screen">
    <div class="title-block">
      <!-- ロゴと出撃ボタンは送ってもらった絵。src は app.js が入れる (1 枚版では埋め込んだ絵を使う) -->
      <img class="logo" data-asset="logo.png" alt="STARBREAK スターブレイク" width="731" height="221">
    </div>
    <div class="title-right">
    <div class="title-menu" id="titleMenu">
      <!-- 板の中は始めるボタン 2 つだけ。設定と遊び方は小さなボタンから同じ板に開く -->
      <div class="menu-view" id="menuMain">
        <button type="button" class="btn-start" id="btnStart" aria-label="出撃"><img data-asset="btn_start.png" alt="" width="427" height="105"><span>出撃</span></button>
        <button type="button" class="btn btn-glass" id="btnBossOnly">巨大戦艦から</button>
      </div>
      <div class="menu-view" id="menuSettings" hidden>
        <p class="sheet-head">設定</p>
        <div class="toggles toggles-col">
          <label><span>上下反転</span><input type="checkbox" id="optInvert"></label>
          <label><span>画面のゆれ</span><input type="checkbox" id="optShake" checked></label>
          <label><span>音</span><input type="checkbox" id="optSound" checked></label>
        </div>
        <button type="button" class="btn btn-glass btn-back" data-back>戻る</button>
      </div>
      <div class="menu-view" id="menuHowto" hidden>
        <p class="sheet-head">遊び方</p>
        <dl class="howto">
          <dt>左手</dt><dd>スティックで機首を向ける。大きく倒すと減速して小回り</dd>
          <dt>LASER</dt><dd>押しているあいだ撃ち続ける</dd>
          <dt>MSL</dt><dd>長押しで照準のまわりの敵を最大 4 つロック。離すと一斉に撃つ</dd>
          <dt>BOOST</dt><dd>速く飛ぶ</dd>
          <dt>LOCK</dt><dd>タップで敵を選ぶ。長押しでその敵へ向く</dd>
        </dl>
        <button type="button" class="btn btn-glass btn-back" data-back>戻る</button>
      </div>
    </div>
    <div class="menu-sub" id="menuSub">
      <button type="button" class="link-btn" id="btnSettings">⚙ 設定</button>
      <button type="button" class="link-btn" id="btnHowto">? 遊び方</button>
    </div>
    </div>
    <p class="version" id="version"></p>
  </section>

  <!-- 一時停止 -->
  <section id="pause" class="screen dim" hidden>
    <div class="panel">
      <h2>一時停止</h2>
      <button type="button" class="btn btn-primary" id="btnResume">再開</button>
      <button type="button" class="btn" id="btnRetry">やり直す</button>
      <button type="button" class="btn" id="btnToTitle">タイトルへ</button>
      <div class="toggles">
        <label><input type="checkbox" id="optInvert2"> 上下反転</label>
        <label><input type="checkbox" id="optShake2"> 画面のゆれ</label>
        <label><input type="checkbox" id="optSound2"> 音</label>
      </div>
      <p class="diag" id="diag"></p>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen dim" hidden>
    <div class="panel result-panel">
      <p class="result-head" id="resultHead">MISSION CLEAR</p>
      <div class="result-body">
        <div class="rank" id="resultRank">A</div>
        <dl class="stats" id="resultStats"></dl>
      </div>
      <div class="row">
        <button type="button" class="btn btn-primary" id="btnAgain">もう一度</button>
        <button type="button" class="btn" id="btnResultTitle">タイトルへ</button>
      </div>
    </div>
  </section>

  <!-- 縦向きのとき -->
  <section id="rotate" class="screen">
    <div class="rotate-ico">⟲</div>
    <p>横向きにして遊んでください</p>
  </section>
</div>

<script src="./three.min.js"></script>
<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
