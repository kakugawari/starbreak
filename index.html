<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STARBREAK</title>
<meta name="description" content="小さな宇宙船で、巨大な敵に挑む。3D 宇宙シューティング">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <!-- 操作 (遊んでいる間だけ出す) -->
  <div id="controls" hidden>
    <div id="stickZone" aria-label="スティック">
      <div class="stick" id="stick"><div class="stick-knob" id="stickKnob"></div></div>
    </div>
    <button type="button" class="pad" id="btnMissile" aria-label="ミサイル"><span class="pad-ico">◆</span><span class="pad-name">MSL</span><span class="pad-sub" id="missileCount">4</span></button>
    <button type="button" class="pad" id="btnTarget" aria-label="ロックオン (タップで敵を選ぶ・押しっぱなしでその敵へ向く)"><span class="pad-ico">◎</span><span class="pad-name">LOCK</span></button>
    <button type="button" class="pad" id="btnBoost" aria-label="ブースト"><span class="pad-ico">»</span><span class="pad-name">BOOST</span></button>
    <button type="button" class="pad" id="btnFire" aria-label="レーザー"><span class="pad-ico">✦</span><span class="pad-name">LASER</span></button>
    <button type="button" id="btnPause" aria-label="一時停止">II</button>
  </div>

  <!-- ボス戦のカットイン。操作のボタンより上に出す (送ってもらった絵)。指の操作は下へ素通しする -->
  <div id="cutin" aria-hidden="true" hidden><img data-asset="cutin.png" alt="" width="1846" height="260"></div>

  <!-- 面の始まりの札 (STAGE n)。数字と名前は app.js が入れる。枠の線・光は SVG、字は文字のまま (グラデーションの字) -->
  <div id="stageCard" aria-hidden="true" hidden>
    <div class="sc-frame"><div class="sc-in">
      <svg class="sc-svg" viewBox="0 0 715 296" aria-hidden="true">
        <defs>
          <linearGradient id="scLine" x1="0" x2="1">
            <stop offset="0" stop-color="#8ff5ee"/><stop offset=".55" stop-color="#9fc4ff"/><stop offset="1" stop-color="#b79cff"/>
          </linearGradient>
        </defs>
        <polygon points="70,148 175,22 540,22 645,148 540,274 175,274" fill="rgba(2,5,16,.62)"/>
        <g fill="none" stroke="url(#scLine)" stroke-linecap="round" stroke-linejoin="round">
          <!-- 外の枠: 上と下の真ん中が切れている -->
          <path d="M335,22 L175,22 L70,148 L175,274 L335,274" stroke-width="1.6"/>
          <path d="M380,22 L540,22 L645,148 L540,274 L380,274" stroke-width="1.6"/>
          <!-- 内の枠 -->
          <path d="M300,40 L190,40 L96,148 L190,256 L300,256" stroke-width="1.1" opacity=".8"/>
          <path d="M415,40 L525,40 L619,148 L525,256 L415,256" stroke-width="1.1" opacity=".8"/>
        </g>
      </svg>
      <div class="sc-num" id="scNum">STAGE 1</div>
      <div class="sc-en" id="scEn">PLANETARY ORBIT</div>
      <div class="sc-ja" id="scJa">惑星軌道</div>
    </div></div>
  </div>

  <!-- タイトル: 後ろの宇宙はゲームの空、左の大きな惑星 (title_planet.jpg) と右の機体は three.js で描く -->
  <section id="title" class="screen">
    <div class="title-logo">
      <svg class="logo-arc" viewBox="0 0 520 70" aria-hidden="true">
        <defs>
          <linearGradient id="arcG" x1="0" x2="1">
            <stop offset="0" stop-color="#7fb4ff" stop-opacity="0"/>
            <stop offset=".62" stop-color="#e6f2ff" stop-opacity="1"/>
            <stop offset="1" stop-color="#7fb4ff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="arcS"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#bfe0ff" stop-opacity=".9"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
        </defs>
        <path d="M 30 66 Q 270 -18 510 52" fill="none" stroke="url(#arcG)" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="335" cy="21" rx="46" ry="9" fill="url(#arcS)"/>
      </svg>
      <h1 class="logo-text">STARBREAK</h1>
      <p class="logo-sub">DEEP SPACE COMBAT</p>
    </div>
    <div class="title-actions">
      <button type="button" class="title-btn title-btn-main" id="btnStart"><span>START</span><span class="title-arrow" aria-hidden="true">→</span></button>
      <button type="button" class="title-btn" id="btnBossOnly"><span>BOSS BATTLE</span><span class="title-arrow" aria-hidden="true">→</span></button>
    </div>
    <nav class="title-links">
      <button type="button" class="link-btn" id="btnSettings">SETTING</button>
      <span class="title-slash" aria-hidden="true">/</span>
      <button type="button" class="link-btn" id="btnHowto">HOW TO PLAY</button>
    </nav>
    <!-- 設定・遊び方: 右に開く板 (もう一度押すか、戻るで閉じる) -->
    <div class="title-menu" id="titleMenu" hidden>
      <div class="menu-view" id="menuSettings" hidden>
        <p class="sheet-head">設定</p>
        <div class="toggles toggles-col">
          <label><span>上下反転</span><input type="checkbox" id="optInvert"></label>
          <label><span>画面のゆれ</span><input type="checkbox" id="optShake" checked></label>
          <label><span>音</span><input type="checkbox" id="optSound" checked></label>
        </div>
        <button type="button" class="btn btn-glass btn-back" data-back>戻る</button>
      </div>
      <div class="menu-view" id="menuHowto" hidden>
        <p class="sheet-head">遊び方</p>
        <dl class="howto">
          <dt>左手</dt><dd>スティックで機首を向ける。大きく倒すと減速して小回り</dd>
          <dt>LASER</dt><dd>押しているあいだ撃ち続ける</dd>
          <dt>MSL</dt><dd>長押しで照準のまわりの敵を最大 4 つロック。離すと一斉に撃つ</dd>
          <dt>BOOST</dt><dd>速く飛ぶ</dd>
          <dt>LOCK</dt><dd>タップで敵を選ぶ。長押しでその敵へ向く</dd>
        </dl>
        <button type="button" class="btn btn-glass btn-back" data-back>戻る</button>
      </div>
    </div>
    <p class="version" id="version"></p>
  </section>

  <!-- 一時停止 -->
  <section id="pause" class="screen dim" hidden>
    <div class="panel">
      <h2>一時停止</h2>
      <button type="button" class="btn btn-primary" id="btnResume">再開</button>
      <button type="button" class="btn" id="btnRetry">やり直す</button>
      <button type="button" class="btn" id="btnToTitle">タイトルへ</button>
      <div class="toggles">
        <label><input type="checkbox" id="optInvert2"> 上下反転</label>
        <label><input type="checkbox" id="optShake2"> 画面のゆれ</label>
        <label><input type="checkbox" id="optSound2"> 音</label>
      </div>
      <p class="diag" id="diag"></p>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen dim" hidden>
    <div class="panel result-panel">
      <p class="result-head" id="resultHead">MISSION CLEAR</p>
      <div class="result-body">
        <div class="rank" id="resultRank">A</div>
        <dl class="stats" id="resultStats"></dl>
      </div>
      <div class="row">
        <button type="button" class="btn btn-primary" id="btnAgain">もう一度</button>
        <button type="button" class="btn" id="btnResultTitle">タイトルへ</button>
      </div>
    </div>
  </section>

  <!-- 縦向きのとき -->
  <section id="rotate" class="screen">
    <div class="rotate-ico">⟲</div>
    <p>横向きにして遊んでください</p>
  </section>
</div>

<script src="./three.min.js"></script>
<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
